# Galaxy Book3 Ultra internal camera (OV02C10 on IPU6), created in the PipeWire
# daemon. WirePlumber 0.5.17's libcamera monitor never finishes activating this
# node, so nothing can link to it; its monitor is disabled in
# ~/.config/wireplumber/wireplumber.conf.d/90-camera-monitors.conf.
context.objects = [
  {
    factory = spa-node-factory
    args = {
      factory.name     = api.libcamera.source
      api.libcamera.path = "\\_SB_.PC00.LNK0"
      node.name        = "libcamera_input.__SB_.PC00.LNK0"
      node.description = "Built-in Front Camera"
      media.class      = "Video/Source"
      media.role       = "Camera"
    }
    flags = [ nofail ]
  }
]
