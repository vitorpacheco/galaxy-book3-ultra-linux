# Galaxy Book3 Ultra, WirePlumber 0.5.17:
#  - libcamera: the node created by this monitor never finishes activation, so
#    nothing can link to the camera. PipeWire creates it instead, see
#    ~/.config/pipewire/pipewire.conf.d/60-libcamera-front-camera.conf.
#  - v4l2: the IPU6 exposes ~32 raw V4L2 capture nodes that are useless to
#    applications, and disabling that device with a rule stalls the 0.5.17
#    event dispatcher (no audio, no camera). USB webcams need this monitor.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
  }
}
