# Only with system/modprobe.d/galaxybook3-audio-no-analog.conf: without the
# analog codec the ACP "HiFi" profile is unavailable and WirePlumber picks
# "off". Expose the HDMI and DMIC PCMs directly instead.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-ucm = true
        api.alsa.use-acp = false
      }
    }
  }
]
