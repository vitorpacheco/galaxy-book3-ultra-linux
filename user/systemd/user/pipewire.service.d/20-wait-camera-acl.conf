# With autologin, WirePlumber can start before logind grants the uaccess ACL
# on the IPU6 media node. libcamera then fails with "Permission denied" on
# /dev/media0 and never retries, so the webcam never shows up in PipeWire.
# Wait (max 5s) until the node is accessible.
[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 50); do ok=1; for m in /dev/media*; do [ -e "$m" ] || continue; { [ -r "$m" ] && [ -w "$m" ]; } || ok=0; done; [ $ok = 1 ] && exit 0; sleep 0.1; done; exit 0'
